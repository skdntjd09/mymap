<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>좋은 거주지 찾기</title>

    <style>
        /* 전체 화면 */
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
            color: #222;
        }

        button, input {
            font: inherit;
        }

        /* 왼쪽 패널과 오른쪽 지도 */
        .app {
            display: grid;
            grid-template-columns: 370px minmax(0, 1fr);
            width: 100%;
            height: 100vh;
            height: 100dvh;
        }

        /* 왼쪽 패널 */
        .sidebar {
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: #fff;
            border-right: 1px solid #e5e7eb;
        }

        .header {
            padding: 21px 18px 13px;
        }

        .header h1 {
            margin: 0 0 7px;
            font-size: 22px;
        }

        .header p {
            margin: 0;
            color: #777;
            font-size: 12px;
            line-height: 1.6;
        }

        /* 지역 검색 영역 */
        .region-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 0 15px 14px;
            padding: 13px;
            border: 1px solid #dfe8f8;
            border-radius: 10px;
            background: #f7faff;
        }

        .region-label {
            font-size: 13px;
            font-weight: 700;
        }

        .region-description {
            color: #777;
            font-size: 11px;
            line-height: 1.6;
        }

        .region-input {
            width: 100%;
            padding: 11px;
            border: 1px solid #d9dce3;
            border-radius: 7px;
            outline: none;
            background: white;
            font-size: 12px;
        }

        .region-input:focus {
            border-color: #3977ed;
        }

        .region-button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 7px;
            background: #3977ed;
            color: white;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .region-button:hover {
            background: #245fd0;
        }

        .clear-region-button {
            padding: 4px;
            border: none;
            background: transparent;
            color: #64748b;
            font-size: 11px;
            cursor: pointer;
        }

        /* 일반 키워드 검색 */
        .search-form {
            display: flex;
            gap: 7px;
            padding: 0 15px 13px;
        }

        .search-input {
            flex: 1;
            min-width: 0;
            padding: 11px;
            border: 1px solid #d9dce3;
            border-radius: 8px;
            outline: none;
            font-size: 12px;
        }

        .search-input:focus {
            border-color: #3977ed;
        }

        .search-button {
            padding: 0 14px;
            border: none;
            border-radius: 8px;
            background: #eaf1ff;
            color: #245fd0;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        /* 세 개의 탭 */
        .tab-container {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
            padding: 0 15px 13px;
        }

        .tab-button {
            min-height: 70px;
            padding: 8px 3px;
            border: 1px solid #e2e6ed;
            border-radius: 9px;
            background: #f7f8fa;
            color: #555;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.5;
            cursor: pointer;
        }

        .tab-button.active {
            border-color: #3977ed;
            background: #edf4ff;
            color: #245fd0;
        }

        .tab-icon {
            display: block;
            margin-bottom: 5px;
            font-size: 19px;
        }

        /* 위치와 검색 상태 */
        .location-status {
            padding: 0 17px 12px;
            color: #64748b;
            font-size: 11px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        /* 결과 제목 */
        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 13px 17px;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .results-header h2 {
            margin: 0;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .result-count {
            color: #3977ed;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        /* 검색 결과 스크롤 */
        .results-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 0 14px 18px;
        }

        .empty-message {
            padding: 24px 8px;
            color: #888;
            font-size: 12px;
            line-height: 1.7;
            text-align: center;
        }

        /* 개별 장소 */
        .place-card {
            padding: 13px 4px;
            border-bottom: 1px solid #eee;
        }

        .place-main {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            width: 100%;
            padding: 0;
            border: none;
            background: transparent;
            text-align: left;
            cursor: pointer;
        }

        .place-name {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .place-category {
            color: #3977ed;
            font-size: 10px;
        }

        .place-address,
        .place-phone {
            color: #777;
            font-size: 11px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .place-link {
            display: inline-block;
            margin-top: 8px;
            color: #3977ed;
            font-size: 11px;
            text-decoration: none;
        }

        /* 지역 점수 카드 */
        .score-card {
            margin-top: 15px;
            padding: 17px;
            border: 1px solid #e1e7f0;
            border-radius: 12px;
            background: #f7faff;
        }

        .score-label {
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
        }

        .score-row {
            display: flex;
            align-items: baseline;
            gap: 5px;
            margin: 8px 0;
        }

        .score-value {
            color: #245fd0;
            font-size: 38px;
            font-weight: 800;
        }

        .score-total {
            color: #777;
            font-size: 13px;
        }

        .score-verdict {
            margin: 5px 0 8px;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.6;
        }

        .score-detail {
            margin: 0;
            color: #64748b;
            font-size: 11px;
            line-height: 1.8;
        }

        /* 점수 분석용 통계 카드 */
        .metric-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            margin-top: 12px;
        }

        .metric-card {
            min-width: 0;
            padding: 12px 10px;
            border: 1px solid #e6e8ed;
            border-radius: 9px;
            background: #fff;
        }

        .metric-title {
            display: block;
            color: #777;
            font-size: 10px;
            line-height: 1.5;
        }

        .metric-value {
            display: block;
            margin: 7px 0;
            font-size: 19px;
            font-weight: 800;
        }

        .metric-detail {
            margin: 0;
            color: #777;
            font-size: 10px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .analysis-note {
            margin: 12px 0;
            padding: 10px;
            border-radius: 8px;
            background: #f3f5f8;
            color: #666;
            font-size: 10px;
            line-height: 1.8;
        }

        .analysis-section-title {
            margin: 22px 0 5px;
            font-size: 13px;
        }

        .analysis-section-subtitle {
            margin: 0;
            color: #888;
            font-size: 10px;
            line-height: 1.6;
        }

        /* 오른쪽 지도 */
        .map-panel {
            position: relative;
            min-width: 0;
            min-height: 0;
            background: #f0f2f5;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-message {
            position: absolute;
            z-index: 10;
            top: 50%;
            left: 50%;
            width: min(85%, 360px);
            padding: 18px;
            transform: translate(-50%, -50%);
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            background: white;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            color: #555;
            font-size: 12px;
            line-height: 1.7;
            text-align: center;
        }

        .map-message[hidden] {
            display: none;
        }

        /* 모바일 화면 */
        @media (max-width: 760px) {
            .app {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: minmax(0, 58dvh) minmax(0, 1fr);
            }

            .sidebar {
                border-right: none;
                border-bottom: 1px solid #e5e7eb;
            }

            .header {
                padding: 13px 14px 10px;
            }

            .header h1 {
                font-size: 19px;
            }

            .region-form {
                margin-right: 12px;
                margin-left: 12px;
            }

            .search-form,
            .tab-container {
                padding-right: 12px;
                padding-left: 12px;
            }

            .location-status {
                padding-right: 14px;
                padding-left: 14px;
            }

            .results-header {
                padding: 10px 14px;
            }

            .results-list {
                padding-right: 12px;
                padding-left: 12px;
            }
        }
    </style>
</head>

<body>
<main class="app">

    <!-- 왼쪽 검색 패널 -->
    <aside class="sidebar">

        <header class="header">
            <h1>좋은 거주지 찾기</h1>
            <p>
                지역을 검색하고 주변 생활 편의시설을 바탕으로
                거주지 점수를 확인하세요.
            </p>
        </header>

        <!-- 행정구역 검색 -->
        <form id="regionForm" class="region-form">
            <label class="region-label" for="regionInput">
                📍 분석할 지역
            </label>

            <span class="region-description">
                시·군·구·동 이름을 입력하세요.
                예: 서울특별시 성동구 성수동
            </span>

            <input
                id="regionInput"
                class="region-input"
                type="text"
                placeholder="예: 경기도 고양시 일산동구"
                autocomplete="off"
                required
            >

            <button class="region-button" type="submit">
                이 지역 점수 분석하기
            </button>

            <button
                id="clearRegionButton"
                class="clear-region-button"
                type="button"
            >
                지역 조건 지우기 · 전국 검색으로 돌아가기
            </button>
        </form>

        <!-- 일반 키워드 검색 -->
        <form id="searchForm" class="search-form">
            <input
                id="searchInput"
                class="search-input"
                type="search"
                placeholder="장소 직접 검색"
                aria-label="장소 직접 검색"
                autocomplete="off"
            >

            <button class="search-button" type="submit">
                검색
            </button>
        </form>

        <!-- 시설별 탭 -->
        <div class="tab-container">

            <button
                id="hospitalTab"
                class="tab-button active"
                type="button"
                aria-pressed="true"
            >
                <span class="tab-icon">🏥</span>
                근처 종합 병원
            </button>

            <button
                id="marketTab"
                class="tab-button"
                type="button"
                aria-pressed="false"
            >
                <span class="tab-icon">🛒</span>
                근처 마트
            </button>

            <button
                id="analysisTab"
                class="tab-button"
                type="button"
                aria-pressed="false"
            >
                <span class="tab-icon">📊</span>
                거주지 분석
            </button>

        </div>

        <div
            id="locationStatus"
            class="location-status"
            aria-live="polite"
        >
            지도를 준비하고 있습니다.
        </div>

        <div class="results-header">
            <h2 id="resultsTitle">대학병원 검색 결과</h2>
            <span id="resultCount" class="result-count">0곳</span>
        </div>

        <div
            id="resultsList"
            class="results-list"
            aria-live="polite"
        >
            <p class="empty-message">
                검색 결과를 불러오고 있습니다.
            </p>
        </div>

    </aside>

    <!-- 오른쪽 지도 -->
    <section class="map-panel" aria-label="장소 검색 지도">
        <div id="map"></div>

        <div id="mapMessage" class="map-message">
            카카오 지도를 불러오는 중입니다.
        </div>
    </section>

</main>

<script>
    // 카카오 JavaScript 앱 키
    const KAKAO_APP_KEY =
        "d5ae3969bdd447520e67f6b8d7e4f91f";

    // 기본 위치: 서울시청
    const DEFAULT_POSITION = {
        latitude: 37.566826,
        longitude: 126.9786567
    };

    // 일반 검색 탭의 설정
    const SEARCH_CONFIG = {
        hospital: {
            title: "대학병원 검색 결과",
            keyword: "대학병원"
        },
        market: {
            title: "마트 및 식료품점 검색 결과",
            keyword: "마트"
        }
    };

    // 지도 및 검색에 사용할 변수
    let map = null;
    let placesService = null;
    let geocoder = null;
    let infoWindow = null;

    // 현재 위치와 지역 위치 마커
    let currentPosition = null;
    let currentMarker = null;
    let regionMarker = null;

    // 장소 검색 마커 목록
    let placeMarkers = [];

    // 화면과 검색 상태
    let activeTab = "hospital";
    let currentRegion = "";
    let latestSearchId = 0;

    // HTML 요소 가져오기
    const mapElement = document.getElementById("map");
    const mapMessage = document.getElementById("mapMessage");

    const regionForm = document.getElementById("regionForm");
    const regionInput = document.getElementById("regionInput");
    const clearRegionButton =
        document.getElementById("clearRegionButton");

    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");

    const hospitalTab = document.getElementById("hospitalTab");
    const marketTab = document.getElementById("marketTab");
    const analysisTab = document.getElementById("analysisTab");

    const locationStatus =
        document.getElementById("locationStatus");

    const resultsTitle =
        document.getElementById("resultsTitle");

    const resultCount =
        document.getElementById("resultCount");

    const resultsList =
        document.getElementById("resultsList");


    // 지도 오류나 로딩 메시지 표시
    function showMapMessage(message) {
        mapMessage.textContent = message;
        mapMessage.hidden = false;
    }


    // 결과 목록에 안내 문구 표시
    function showListMessage(message) {
        const paragraph = document.createElement("p");

        paragraph.className = "empty-message";
        paragraph.textContent = message;

        resultsList.replaceChildren(paragraph);
    }


    // 팝업에 넣을 문자열의 특수문자 처리
    function escapeHtml(value) {
        const entities = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        };

        return String(value).replace(/[&<>"']/g, function (character) {
            return entities[character];
        });
    }


    // 카카오 지도 SDK를 불러오기
    function loadKakaoSdk() {
        let isSdkReady = false;

        const timeoutId = window.setTimeout(function () {
            if (!isSdkReady) {
                showMapMessage(
                    "지도 로딩이 지연되고 있습니다. " +
                    "인터넷 연결, JavaScript 키, 웹 도메인 설정을 확인해 주세요."
                );
            }
        }, 20000);

        const sdkScript = document.createElement("script");

        sdkScript.src =
            "https://dapi.kakao.com/v2/maps/sdk.js" +
            "?appkey=" + encodeURIComponent(KAKAO_APP_KEY) +
            "&libraries=services&autoload=false";

        sdkScript.async = true;

        // SDK 파일 로딩에 실패한 경우
        sdkScript.onerror = function () {
            clearTimeout(timeoutId);

            showMapMessage(
                "지도 SDK를 불러오지 못했습니다. 카카오 설정을 확인해 주세요."
            );
        };

        // SDK 파일 로드 후 지도 API 초기화를 기다림
        sdkScript.onload = function () {
            if (
                !window.kakao ||
                !window.kakao.maps ||
                typeof window.kakao.maps.load !== "function"
            ) {
                clearTimeout(timeoutId);

                showMapMessage(
                    "지도 API 초기화에 실패했습니다."
                );

                return;
            }

            // 지도 API가 완전히 준비된 다음 지도 생성
            kakao.maps.load(function () {
                isSdkReady = true;
                clearTimeout(timeoutId);
                initializeMap();
            });
        };

        document.head.appendChild(sdkScript);
    }


    // 지도와 장소 검색 서비스 초기화
    function initializeMap() {
        try {
            currentPosition = new kakao.maps.LatLng(
                DEFAULT_POSITION.latitude,
                DEFAULT_POSITION.longitude
            );

            map = new kakao.maps.Map(mapElement, {
                center: currentPosition,
                level: 5
            });

            // 장소 검색과 주소 검색 서비스
            placesService = new kakao.maps.services.Places(map);
            geocoder = new kakao.maps.services.Geocoder();

            infoWindow = new kakao.maps.InfoWindow({
                zIndex: 3
            });

            // 지도가 실제로 표시되면 로딩 메시지 숨김
            kakao.maps.event.addListener(
                map,
                "tilesloaded",
                function () {
                    mapMessage.hidden = true;
                }
            );

            // 현재 위치를 표시하되, 검색 결과는 전국에서 검색
            requestCurrentLocation();

            // 페이지를 열면 대학병원 전국 키워드 검색
            searchActiveTab();

        } catch (error) {
            showMapMessage(
                "지도 초기화 중 오류가 발생했습니다. 브라우저 콘솔을 확인해 주세요."
            );

            console.error("지도 초기화 오류:", error);
        }
    }


    // 현재 위치 권한 요청
    function requestCurrentLocation() {
        if (!navigator.geolocation) {
            locationStatus.textContent =
                "현재 위치는 사용할 수 없지만 전국 검색은 가능합니다.";

            return;
        }

        navigator.geolocation.getCurrentPosition(
            function (position) {
                currentPosition = new kakao.maps.LatLng(
                    position.coords.latitude,
                    position.coords.longitude
                );

                // 현재 위치 마커 표시
                if (currentMarker) {
                    currentMarker.setMap(null);
                }

                currentMarker = new kakao.maps.Marker({
                    map: map,
                    position: currentPosition,
                    title: "현재 위치"
                });

                // 아직 검색 결과가 없다면 현재 위치로 지도 이동
                if (
                    placeMarkers.length === 0 &&
                    !currentRegion &&
                    activeTab !== "analysis"
                ) {
                    map.setCenter(currentPosition);
                    map.setLevel(5);
                }

                locationStatus.textContent =
                    currentRegion
                        ? currentRegion + " 분석 중 · 지역 키워드 검색"
                        : "현재 위치 표시 · 검색은 전국 키워드 기준";
            },

            function () {
                locationStatus.textContent =
                    "현재 위치 권한을 사용할 수 없습니다. " +
                    "그래도 전국 검색과 지역 분석은 가능합니다.";
            },

            {
                enable
